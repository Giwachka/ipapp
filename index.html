<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой IP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 24px; border-radius: 16px;
            max-width: 340px; width: 100%;
        }
        .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid rgba(128,128,128,0.2); }
        .row:last-child { border-bottom: none; }
        .label { opacity: 0.7; }
        .loading { text-align: center; font-size: 16px; }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="loading" id="loading">Загрузка данных...</div>
        <div id="data" style="display: none;"></div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Автоматически запрашиваем данные и отправляем в бот
    fetch('https://ipinfo.io/json')
        .then(r => r.json())
        .then(data => {
            // Заполняем поля
            const fields = [
                ['IP-адрес', data.ip],
                ['Город', data.city],
                ['Регион', data.region],
                ['Страна', data.country],
                ['Континент', data.continent || data.country], // fallback
                ['Провайдер', data.org],
                ['Часовой пояс', data.timezone],
                ['Почтовый индекс', data.postal],
                ['Координаты', data.loc]
            ];

            let html = '';
            fields.forEach(([label, value]) => {
                if (value && value !== '—' && value !== 'undefined') {
                    html += `<div class="row"><span class="label">${label}</span><span>${value}</span></div>`;
                }
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('data').innerHTML = html;
            document.getElementById('data').style.display = 'block';

            // Сразу отправляем данные в бот
            setTimeout(() => {
                tg.sendData(JSON.stringify({
                    ip: data.ip,
                    city: data.city,
                    region: data.region,
                    country: data.country,
                    continent: data.continent || '',
                    org: data.org,
                    timezone: data.timezone,
                    postal: data.postal,
                    loc: data.loc
                }));
                tg.close();
            }, 1000); // Небольшая задержка, чтобы пользователь успел увидеть данные
        })
        .catch(err => {
            document.getElementById('loading').textContent = 'Не удалось получить данные';
            console.error(err);
        });
</script>
</body>
</html>
