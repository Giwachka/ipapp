<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой IP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            max-width: 340px;
            width: 100%;
        }
        .label { opacity: 0.7; font-size: 14px; }
        .ip {
            font-size: 22px;
            font-weight: 600;
            margin: 12px 0 20px;
            word-break: break-all;
        }
        .row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
        }
        .row span:last-child { font-weight: 500; }
        button {
            margin-top: 20px;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 16px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="label">Ваш IP-адрес</div>
        <div class="ip" id="ip">загрузка...</div>
        <div id="info"></div>
        <button onclick="sendToBot()">Отправить в бот</button>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let ipData = null;

    // Получаем IP и гео с публичного API
    fetch('https://ipinfo.io/json')
        .then(r => r.json())
        .then(data => {
            ipData = data;
            document.getElementById('ip').textContent = data.ip || '—';
            document.getElementById('info').innerHTML = `
                <div class="row"><span>Город</span><span>${data.city || '—'}</span></div>
                <div class="row"><span>Регион</span><span>${data.region || '—'}</span></div>
                <div class="row"><span>Страна</span><span>${data.country || '—'}</span></div>
                <div class="row"><span>Провайдер</span><span>${data.org || '—'}</span></div>
            `;
        })
        .catch(() => {
            document.getElementById('ip').textContent = 'не удалось получить';
        });

    function sendToBot() {
        if (!ipData) return;
        tg.sendData(JSON.stringify({
            ip: ipData.ip,
            city: ipData.city,
            region: ipData.region,
            country: ipData.country,
            org: ipData.org
        }));
        tg.close();
    }
</script>
</body>
</html>
